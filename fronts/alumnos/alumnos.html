<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumnos</title>
  <link rel="stylesheet" href="/estilos.css">
</head>

<body>
  <nav>
    <a href="/alumnos.html">Items</a>
    <a href="/procedimiento.html">Procedimiento</a>
    <a href="/cerrar-sesion">Cerrar sesión</a>
  </nav>

  <main>
    <h1>Lista de Alumnos</h1>
    <ul id="lista-alumnos"></ul>
  </main>

  <script>
    fetch('/alumnos')
      .then(res => {
        if (res.redirected) {
          window.location.href = res.url
          return
        }
        return res.json()
      })
      .then(data => {
        if (!data) return
        const lista = document.getElementById('lista-alumnos')
        data.datos.forEach(alumno => {
          const li = document.createElement('li')
          // enlace a alumno.html con query string ?id=X
          li.innerHTML = `<a href="/alumno_detalle.html?id=${alumno.id}">${alumno.nombre} ${alumno.apellido} — Grupo: ${alumno.grupo}</a>`
          lista.appendChild(li)
        })
      })
      .catch(err => console.error('Error al obtener alumnos:', err))
  </script>
</body>

</html>
